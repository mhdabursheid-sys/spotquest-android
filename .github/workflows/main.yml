name: Build SpotQuest APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract SpotQuest project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "SpotQuest_Fixed_
