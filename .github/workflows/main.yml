
name: Build SpotQuest APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract SpotQuest project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -o -iname "*SpotQuest*" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "SpotQuest project archive not found"
            ls -la
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          find project -
