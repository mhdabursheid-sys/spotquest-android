name: Build SpotQuest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 1 -type f -iname "*SpotQuest*.zip" | head -1)
          echo "ZIP found: $ZIP"
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle.kts" | head -1)
          test -n "$SETTINGS"
          DIR=$(dirname "$SETTINGS")
          echo "Android project: $DIR"
          cd "$DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotQuest-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
